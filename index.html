<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EasyCentral Bot</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#16202e; --mute:#647084; --line:#dfe4ec; --brand:#14406e; --brand-ink:#ffffff;
  --accent:#1f6fd0; --ok:#1c8a4d; --bad:#c23b32; --warn:#b26b00; --sel:#e3effd; --chip:#eaeef4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141b; --card:#19212c; --ink:#e8edf4; --mute:#93a0b3; --line:#2a3443; --brand:#0f2b4a; --brand-ink:#e8edf4;
    --accent:#5aa2f5; --ok:#4cc584; --bad:#f0736a; --warn:#e2a23f; --sel:#1d3350; --chip:#232d3b; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none}
button,input,textarea{font:inherit; color:inherit}
.hide{display:none !important}
#app{display:flex; flex-direction:column; height:100%}
header{background:var(--brand); color:var(--brand-ink); padding:10px 14px; display:flex; align-items:center; gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top))}
header .t{font-weight:650; font-size:16px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
header .sub{font-size:12px; opacity:.8; font-weight:400}
.dot{width:10px; height:10px; border-radius:50%; background:#8a94a3; flex:none}
.dot.on{background:#3ddc84} .dot.off{background:#ff6b5e}
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px; padding-bottom:20px}
nav{display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1; background:none; border:0; padding:10px 2px 9px; color:var(--mute); font-size:12.5px; font-weight:600;
  border-top:3px solid transparent}
nav button.on{color:var(--accent); border-top-color:var(--accent)}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px}
.big{font-size:19px; font-weight:650}
.mute{color:var(--mute)} .small{font-size:12.5px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 12px; font-weight:600; font-size:14px;
  min-height:40px}
.btn:active{filter:brightness(.93)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.stop{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45}
.seg{display:flex; background:var(--chip); border-radius:10px; padding:3px; margin-bottom:10px}
.seg button{flex:1; border:0; background:none; padding:8px 4px; border-radius:8px; font-weight:600; font-size:13.5px; color:var(--mute)}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.acts{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:2px}
.acts .btn{white-space:nowrap; flex:none; padding:7px 10px; min-height:36px; font-size:13px}
.item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin-bottom:6px; display:flex; gap:9px}
.item.sel{background:var(--sel); border-color:var(--accent)}
.item .no{color:var(--mute); font-size:12px; min-width:24px; text-align:right; padding-top:2px; font-variant-numeric:tabular-nums}
.item .b{flex:1; min-width:0}
.item .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .meta{font-size:12.5px; color:var(--mute); display:flex; gap:10px; flex-wrap:wrap}
.item .url{font-size:11.5px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr}
.empty{text-align:center; color:var(--mute); padding:26px 10px}
label.f{display:block; font-size:12.5px; color:var(--mute); margin:10px 0 4px; font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=url],textarea{
  width:100%; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:10px; min-height:42px; outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:150px; resize:vertical; font-size:13px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#log{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word}
#log div{padding:3px 0; border-bottom:1px solid var(--line)}
#log .bad{color:var(--bad)}
#login{max-width:420px; margin:0 auto; padding:22px 16px}
#login h1{font-size:22px; margin:8px 0 2px}
.msg{margin-top:12px; padding:10px; border-radius:10px; background:var(--chip); font-size:13.5px}
.msg.bad{background:rgba(194,59,50,.14); color:var(--bad)}
#modal{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:20}
#modal .sheet{background:var(--card); width:100%; border-radius:16px 16px 0 0; padding:16px; max-height:92%; overflow:auto;
  padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 8px; font-size:16px}
#toast{position:fixed; left:12px; right:12px; bottom:76px; background:#222b38; color:#fff; padding:10px 12px; border-radius:10px;
  font-size:13.5px; z-index:30; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad)}
.switch{display:flex; align-items:center; gap:10px; margin-top:10px}
.switch input{width:22px; height:22px}
.pill{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--chip); font-size:12px; font-weight:600}
.pill.ok{background:rgba(28,138,77,.16); color:var(--ok)} .pill.warn{background:rgba(178,107,0,.16); color:var(--warn)}
</style>
</head>
<body>
<div id="app">
  <!-- ============ log-in ============ -->
  <div id="login" class="hide">
    <h1>EasyCentral Bot</h1>
    <div class="mute" data-t="login_sub"></div>
    <label class="f" data-t="addr_home"></label>
    <input id="a_home" type="text" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="192.168.1.25:8765">
    <label class="f" data-t="addr_out"></label>
    <input id="a_out" type="text" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="88.200.10.20:8765">
    <label class="f" data-t="pin"></label>
    <input id="a_pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••">
    <div class="row" style="margin-top:16px">
      <button id="b_connect" class="btn pri" style="flex:1" data-t="connect"></button>
      <button id="b_lang" class="btn"></button>
    </div>
    <div id="login_msg" class="msg hide"></div>
    <div class="mute small" style="margin-top:16px" data-t="login_help"></div>
  </div>

  <!-- ============ main ============ -->
  <header id="hdr" class="hide">
    <span id="dot" class="dot"></span>
    <div class="t"><span id="h_title">EasyCentral Bot</span> <span id="h_sub" class="sub"></span></div>
  </header>
  <main id="main" class="hide">
    <section id="v_scan">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div><div id="s_state" class="big"></div><div id="s_next" class="mute small"></div></div>
          <span id="s_busy" class="pill"></span>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="b_toggle" class="btn pri" style="flex:1"></button>
          <button id="b_now" class="btn" data-t="run_now"></button>
        </div>
      </div>
      <div class="seg" id="seg_scan">
        <button data-l="pending"></button><button data-l="done"></button><button data-l="repeat"></button>
      </div>
      <div class="acts" id="acts_scan"></div>
      <input id="q_scan" type="text" data-ph="search" style="margin-bottom:8px">
      <div id="list_scan"></div>
    </section>

    <section id="v_split" class="hide">
      <div class="card">
        <div class="row" style="justify-content:space-between"><div class="big" data-t="splitter"></div><span id="p_state" class="pill"></span></div>
        <label class="f" data-t="split_link"></label>
        <input id="p_url" type="text" inputmode="url" autocomplete="off" autocapitalize="off">
        <div class="grid2">
          <div><label class="f" data-t="limit"></label><input id="p_limit" type="number" inputmode="numeric"></div>
          <div><label class="f" data-t="wait"></label><input id="p_wait" type="number" inputmode="numeric"></div>
          <div><label class="f" data-t="start_price"></label><input id="p_start" type="text" inputmode="decimal"></div>
          <div><label class="f" data-t="min_price"></label><input id="p_min" type="text" inputmode="decimal"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button id="b_split" class="btn pri" style="flex:1" data-t="split_start"></button>
          <button id="b_split_stop" class="btn stop" data-t="stop"></button>
        </div>
        <div class="row" style="margin-top:8px"><button id="b_fill" class="btn" style="flex:1" data-t="fill"></button></div>
      </div>
      <div class="row" style="justify-content:space-between; margin-bottom:8px"><b id="saved_title"></b></div>
      <div class="acts" id="acts_split"></div>
      <div id="list_split"></div>
    </section>

    <section id="v_log" class="hide"><div class="card"><div id="log"></div></div></section>

    <section id="v_set" class="hide">
      <div class="card">
        <div class="big" data-t="set_scan"></div>
        <label class="f" data-t="interval"></label>
        <div class="row"><input id="e_interval" type="number" inputmode="numeric" style="flex:1"><button id="b_interval" class="btn" data-t="apply"></button></div>
        <label class="f" data-t="step_wait"></label>
        <div class="row"><input id="e_step" type="number" inputmode="numeric" style="flex:1"><button id="b_step" class="btn" data-t="apply"></button></div>
        <label class="f" data-t="filter"></label>
        <div class="row"><input id="e_filter" type="text" style="flex:1"><button id="b_filter" class="btn" data-t="apply"></button></div>
        <label class="switch"><input id="e_rep_on" type="checkbox"><span data-t="repeat_on"></span></label>
        <label class="f" data-t="repeat_days"></label>
        <div class="row"><input id="e_rep_days" type="number" inputmode="numeric" style="flex:1"><button id="b_rep_days" class="btn" data-t="apply"></button></div>
      </div>
      <div class="card">
        <div class="big" data-t="set_conn"></div>
        <div id="conn_info" class="mute small" style="margin:6px 0 10px"></div>
        <div class="row"><button id="b_logout" class="btn danger" data-t="logout"></button><button id="b_lang2" class="btn"></button></div>
      </div>
    </section>
  </main>
  <nav id="nav" class="hide">
    <button data-v="scan" data-t="tab_scan"></button><button data-v="split" data-t="tab_split"></button>
    <button data-v="log" data-t="tab_log"></button><button data-v="set" data-t="tab_set"></button>
  </nav>
</div>
<div id="modal" class="hide"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hide"></div>

function sha256(msg){
  var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;

  m[total-8]=hi>>>24; m[total-7]=hi>>>16; m[total-6]=hi>>>8; m[total-5]=hi;

      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for (i = 0; i < 64; i++){
      var S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));

  var ctl = (typeof AbortController === "function") ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, ms);
  return fetch("http://" + addr + "/api", {method: "POST", body: JSON.stringify(obj), headers: {"Content-Type": "text/plain"},
                signal: ctl ? ctl.signal : undefined, cache: "no-store"})
    .then(function(r){ clearTimeout(timer); if (!r.ok) throw new Error("net"); return r.json(); },
          function(){ clearTimeout(timer); throw new Error("net"); });
}

  /* log in: tries the addresses one after the other */
  login: function(addrs, pin){
    var self = this, i = 0;
    function tryNext(){
      if (i >= addrs.length) return Promise.reject(AppError("net"));
      var addr = addrs[i++], srp = Object.create(SRP), A = srp.start();
      return post(addr, {t: "hello", A: A}, 5000).then(function(h){
        if (h.err === "locked") throw AppError("locked", h.wait);
        if (!h.sid || !h.salt || !h.B) throw AppError("proto");
        var r = srp.finish(pin, h.salt, h.B);
        return post(addr, {t: "login", sid: h.sid, M1: r.m1}, 8000).then(function(l){
          if (l.err === "pin") throw AppError("pin", l.wait);
          if (l.err === "locked") throw AppError("locked", l.wait);
          if (!l.sid || l.M2 !== r.m2) throw AppError("proto");
          self.addr = addr; self.sid = l.sid; self.keys = r; self.n = 0;
        }, function(e){ if (e && e.code) throw e; throw AppError("net"); });
      }, function(e){ if (e && e.code) throw e; return tryNext(); });
    }
    return tryNext();
  },
  call: function(obj, ms){

function connect(fromForm){
  if (!HAS_BIG || !window.crypto || !window.fetch || typeof TextEncoder !== "function") return showLogin(T("e_old"), true);
  var home, out, pin;
  if (fromForm){
    home = normAddr($("a_home").value); out = normAddr($("a_out").value); pin = $("a_pin").value.trim();
    if (!home && !out) return showLogin(T("e_addr"), true);

  } else { home = Store.get("home"); out = Store.get("out"); pin = Store.get("pin"); }
  var addrs = []; if (home) addrs.push(home); if (out && out !== home) addrs.push(out);

function startLoop(){
  var my = ++S.loop;
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function relogin(){
    return Link.login(S.addrs, S.pin).then(resetSync, function(e){
      if (e.code === "pin"){ Store.set("pin", ""); showLogin(errText(e), true); throw e; }
      return sleep(e.code === "locked" ? 15000 : 3000);
    });
  }
  function step(){
    if (my !== S.loop) return;
    if (document.hidden) return setTimeout(step, 1000);
    var known = {ver: S.ver, log: S.logN, lists: {}};
    for (var k in S.lists) known.lists[k] = S.lists[k].ver;
    var p = Link.keys ? Link.call({op: "state", wait: S.ver !== null, known: known}, 32000) : Promise.reject(AppError("session"));
    p.then(function(st){
      if (my !== S.loop) return;
      applyState(st); setOnline(true); step();
    }, function(e){
      if (my !== S.loop) return;

  if (sel.length !== 1) return toast(T("select_one"), true);
  modal(function(s){
    s.appendChild(el("h3", null, T("rev_title")));
    var ta = el("textarea"); ta.id = "m_text"; ta.value = sel[0]; ta.style.minHeight = "110px"; s.appendChild(ta);
    buttons(s, T("save"), "pri", function(){
      var v = ta.value.trim(); if (!v) return;
      closeModal(); S.sel.pending = {}; cmd({op: "revise", old: sel[0], "new": v}, T("sent"));
    });
  });
}
function removeSel(){
  var name = curList(), urls = selected(name);
  if (!urls.length) return toast(T("select_first"), true);
  confirmBox(T("confirm_remove", {n: urls.length}), function(){
    S.sel[name] = {}; cmd({op: "remove", list: name, urls: urls}, function(r){ return T("removed", {n: r.n}); });
  });
}
function clearList(){
  var name = curList(); if (!S.lists[name].rows.length) return;
  confirmBox(T("confirm_clear", {name: T(name)}), function(){ S.sel[name] = {}; cmd({op: "clear", list: name}); });
}
function selAll(){
  var name = curList();
  if (selected(name).length) S.sel[name] = {};
  else S.lists[name].rows.forEach(function(r){ S.sel[name][r.u] = 1; });
  renderLists();
}
function move(from, to, all){
  var urls = selected(from);
  if (!all && !urls.length) return toast(T("select_first"), true);
  S.sel[from] = {};
  cmd(all ? {op: "move", from: from, to: to, all: true} : {op: "move", from: from, to: to, urls: urls}, function(r){ return T("moved", {n: r.n}); });
  renderLists();
}
function copySaved(){
  var urls = selected("saved"); if (!urls.length) urls = S.lists.saved.rows.map(function(r){ return r.u; });
  if (!urls.length) return;
  var text = urls.join("\n"), okc = false;
  try { if (window.Android && Android.copy){ Android.copy(text); okc = true; } } catch(e){}
  if (!okc){ var ta = el("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { okc = document.execCommand("copy"); } catch(e){} document.body.removeChild(ta); }
  toast(T("copied", {n: urls.length}));
}
function onItemTap(ev){
  var it = ev.target.closest ? ev.target.closest(".item") : null; if (!it) return;
  var name = curList(), u = it.getAttribute("data-u");
  if (S.sel[name][u]) delete S.sel[name][u]; else S.sel[name][u] = 1;
  it.classList.toggle("sel");
  renderActs(name, name === "saved" ? $("acts_split") : $("acts_scan"));
}
function setNum(id, key){
  var v = parseInt($(id).value, 10); if (isNaN(v)) return toast(T("err_number"), true);
  var o = {op: "set"}; o[key] = v; cmd(o, T("sent"));
}

/* ----- wiring ----- */
window.onBack = function(){                 /* Android's back button */
  if (!$("modal").classList.contains("hide")){ closeModal(); return true; }
  if (!$("main").classList.contains("hide") && S.view !== "scan"){ setView("scan"); return true; }
  return false;
};
function init(){
  applyTexts();
  $("b_connect").onclick = function(){ connect(true); };
  $("b_lang").onclick = $("b_lang2").onclick = setLang;
  $("a_pin").oninput = function(){ this.value = this.value.replace(/[^0-9]/g, "").slice(0, 6); };
  $("nav").onclick = function(e){ var v = e.target.getAttribute("data-v"); if (v) setView(v); };
  $("seg_scan").onclick = function(e){ var l = e.target.getAttribute("data-l"); if (l){ S.scanList = l; $("q_scan").value = ""; renderLists(); } };
  $("q_scan").oninput = renderLists;
  $("list_scan").onclick = $("list_split").onclick = onItemTap;
  $("b_toggle").onclick = function(){ cmd({op: "scan", on: !S.status.running}); };
  $("b_now").onclick = function(){ cmd({op: "run_now"}, T("sent")); };
  $("b_split").onclick = function(){
    cmd({op: "split_start", url: $("p_url").value.trim(), limit: $("p_limit").value, wait: $("p_wait").value,
         start_price: $("p_start").value.trim(), min_price: $("p_min").value.trim()}, T("sent"));
  };
  $("b_split_stop").onclick = function(){ cmd({op: "split_stop"}, T("sent")); };
  $("b_fill").onclick = function(){ cmd({op: "fill"}, T("sent")); };
  $("b_interval").onclick = function(){ setNum("e_interval", "interval"); };
  $("b_step").onclick = function(){ setNum("e_step", "step_wait"); };
  $("b_rep_days").onclick = function(){ setNum("e_rep_days", "repeat_days"); };
  $("b_filter").onclick = function(){ cmd({op: "set", filter: $("e_filter").value}, T("sent")); };
  $("e_rep_on").onchange = function(){ cmd({op: "set", repeat_on: this.checked}); };
  $("b_logout").onclick = function(){ Store.set("pin", ""); Link.keys = null; showLogin(); };
  $("modal").onclick = function(e){ if (e.target === this) closeModal(); };
  connect(false);
}
init();
</script>
</body>
</html>
